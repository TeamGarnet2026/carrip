name: Test

# PR と main への push で単体テストを実行し、カバレッジレポートを保存する。

on:
  pull_request:
    paths:
      - 'carrip/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'carrip/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: carrip
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: carrip/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Write coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
              console.log(["### Coverage (lib)", "", "| | % | covered / total |", "|---|---|---|",
                row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: carrip/coverage/
          retention-days: 14
